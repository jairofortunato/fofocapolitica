<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siga a Emenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap">
<style>
/* Conceito: tela de escolha de fase de um jogo. No topo, as emendas como cartas; embaixo,
   a árvore em que o dinheiro desce como luz de Brasília até a cidade. */
:root{
  color-scheme:dark;
  --void:#05070b; --deep:#0a1018; --edge:#1d2a3a; --text:#ece8dc; --dim:#8f98a6;
  --gold:#FDBD27; --cyan:#7fe6f2; --pale:#e9e4d6; --red:#ff4d4d; --alert:#ff8a3d;
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--text);font-family:var(--body)}
body{min-height:100vh;background:
  radial-gradient(ellipse 50% 34% at 50% -6%, rgba(253,189,39,.30), transparent 70%),
  radial-gradient(ellipse 80% 60% at 50% 35%, rgba(40,80,120,.16), transparent 70%),
  linear-gradient(180deg,var(--deep),var(--void) 60%);background-attachment:fixed}
.num{font-variant-numeric:tabular-nums}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

header.wrap{padding-block:28px 6px;display:flex;justify-content:space-between;align-items:end;gap:12px 24px;flex-wrap:wrap}
.kicker{font-weight:800;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:4px 0 0;font-size:clamp(40px,6.5vw,72px);line-height:1.02;text-shadow:0 0 30px rgba(253,189,39,.3)}
h1 span{color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* Cartas das emendas */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding-block:18px}
.carta{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;align-content:start;padding:16px 16px 14px;min-width:0;
  background:linear-gradient(180deg,rgba(22,34,48,.9),rgba(10,15,22,.9));border:1px solid var(--edge);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);transition:transform .15s ease,border-color .15s}
.carta:hover{transform:translateY(-2px);border-color:#3a4b60}
.carta[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,rgba(60,44,8,.85),rgba(14,14,10,.9));box-shadow:inset 0 0 0 1px var(--gold)}
.carta:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.carta .quem{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.carta[aria-pressed="true"] .quem{color:var(--gold)}
.carta .v{font-family:var(--display);font-size:34px;line-height:1}
.carta .o{font-size:14px;font-weight:600}
.carta .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.carta .dots i{width:8px;height:8px;border-radius:50%;display:block}
.carta .st{justify-self:start;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 7px;border:1.5px solid currentColor}
.st.ok{color:var(--cyan)} .st.mal{color:var(--red)}

/* HUD da emenda escolhida */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 28px;align-items:center;padding-block:6px 14px}
.cont{display:flex;gap:18px;flex-wrap:wrap}
.cont span{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:30px;line-height:1}
.xp{display:grid;gap:6px;min-width:0}
.xp .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--dim)}
.xp .row b{color:var(--text)}
.xp .bar{height:14px;background:#0b121b;border:1px solid var(--edge);overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,#3fb9c7,var(--cyan));box-shadow:0 0 16px rgba(127,230,242,.45);transition:width .5s ease}
.xp .bar.mal i{background:linear-gradient(90deg,#b52b2b,var(--red))}
@media (max-width:640px){.hud{grid-template-columns:1fr}}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start;padding-bottom:40px}
.map{overflow-x:auto;min-width:0}
.map svg{display:block;width:100%;min-width:680px;height:auto}
.node{cursor:pointer}
.node .shape{transition:transform .2s ease}
.node:hover .shape,.node.sel .shape{transform:scale(1.13)}
.node text{pointer-events:none;paint-order:stroke;stroke:#05070b;stroke-width:5px;stroke-linejoin:round}
.node .sig{stroke:none;font-family:var(--display);fill:#1a1204}
.lbl{font-family:var(--body);fill:var(--text);font-weight:800}
.sub{font-family:var(--body);fill:var(--dim)}
.lbl.r,.sub.r{fill:#ff8a8a}
.ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
.node.sel .ring{opacity:1;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{stroke-opacity:.9;transform:scale(1)}to{stroke-opacity:0;transform:scale(1.7)}}
.ponta{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:4px;fill:#8a7330;text-transform:uppercase}

.panel{position:sticky;top:16px;background:linear-gradient(180deg,rgba(18,28,40,.96),rgba(10,15,22,.96));border:1px solid var(--edge);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);padding:20px;display:grid;gap:12px;max-height:calc(100vh - 32px);overflow:auto}
.tipo{justify-self:start;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:5px 9px;border:1.5px solid currentColor}
.tipo.cita,.tipo.fim{color:var(--gold)} .tipo.cruzado{color:var(--cyan)} .tipo.duvida{color:var(--pale)} .tipo.lacuna{color:var(--red)}
.panel h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1.02;margin:0;text-wrap:balance}
.panel .valor{font-family:var(--display);font-size:32px;color:var(--gold);line-height:1}
.panel .data{font-size:14px;color:var(--dim)}
.panel p{margin:0;font-size:15px;line-height:1.5}
.blk{border-top:1px solid var(--edge);padding-top:10px;display:grid;gap:4px}
.blk h3{margin:0;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.blk.liga h3{color:var(--cyan)}
.blk.alerta{border:1px solid rgba(255,138,61,.5);background:rgba(255,138,61,.08);padding:10px 12px}
.blk.alerta h3{color:var(--alert)}
.blk p{font-size:14px}
.nav{display:flex;gap:8px}
.nav button{flex:1;font:800 13px/1 var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--text);background:#132030;border:1px solid var(--edge);padding:12px;cursor:pointer}
.nav button:hover{border-color:var(--gold);color:var(--gold)}
.nav .pos{align-self:center;font-size:13px;color:var(--dim)}
.close{display:none}


@media (max-width:1080px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:50vh;clip-path:none;border-width:2px 0 0;border-color:var(--gold);
    padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
  .close{display:block;position:absolute;top:10px;right:max(12px, env(safe-area-inset-right, 0px));background:none;border:1px solid var(--edge);color:var(--text);font:800 12px var(--body);padding:8px 10px;cursor:pointer}
}
@media (prefers-reduced-motion: reduce){.node.sel .ring{animation:none;opacity:.8}.node .shape,.carta,.xp .bar i{transition:none}}
</style>
</head>

const TIPO = {cita:"Documento cita a emenda",cruzado:"Ligamos nós",duvida:"Provável",lacuna:"Elo que falta",fim:"Resultado"};
const COR = {cita:"#FDBD27",fim:"#FDBD27",cruzado:"#7fe6f2",duvida:"#e9e4d6",lacuna:"#ff4d4d"};
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const mi = v => "R$ " + (v>=1e6 ? (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi" : (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+" mil");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const reais = n => !n.dup;

/* Cartas */
const deck = document.getElementById("deck");
deck.innerHTML = TRILHAS.map(T=>{
  const dots = T.N.filter(reais).map(n=>`<i style="background:${COR[n.tipo]}"></i>`).join("");
  return `<button class="carta" type="button" id="carta-${T.id}" data-id="${T.id}" aria-pressed="false">
    <span class="quem">${esc(T.quem)} · ${esc(T.cidade)}</span>
    <span class="v num">${mi(T.total)}</span><span class="o">${esc(T.o)}</span>
    <span class="dots" aria-hidden="true">${dots}</span>
    <span class="st ${T.st[1]}">${esc(T.st[0])}</span></button>`;
}).join("");

/* Desenho */
const W=1000, RH=122, TOP=70;
const hex = r => Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-90);return (r*Math.cos(a)).toFixed(1)+","+(r*Math.sin(a)).toFixed(1)}).join(" ");
const curva = (a,b) => {const my=(a.py+b.py)/2;return `M${a.px},${a.py} C${a.px},${my} ${b.px},${my} ${b.px},${b.py}`};
const ES = {
 of:'stroke="#FDBD27" stroke-width="3.2" filter="url(#gl)"',
 cz:'stroke="#7fe6f2" stroke-width="2.2" stroke-dasharray="8 6" opacity=".85"',
 dv:'stroke="#e9e4d6" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"',
 qb:'stroke="#ff4d4d" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" opacity=".8"',
 dp:'stroke="#5d6b7c" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"'
};
function nodeSvg(n){
  let shape, r;
  if(n.tipo==="cita"||n.tipo==="fim"){
    r = n.hub?36:27; const fs = n.sig.length>2?(n.hub?17:14):(n.hub?22:17);
    shape = `<polygon points="${hex(r+7)}" fill="none" stroke="#FDBD27" stroke-opacity=".35" stroke-width="1.5"/>
      <polygon points="${hex(r)}" fill="url(#gg)" stroke="#fff3c4" stroke-width="1.5" filter="url(#gl)"/>
      <text class="sig" y="${fs*.36}" text-anchor="middle" font-size="${fs}">${esc(n.sig)}</text>`;
  } else if(n.tipo==="cruzado"){
    r=17; shape=`<circle r="17" fill="#0b1a22" stroke="#7fe6f2" stroke-width="3" filter="url(#glc)"/><circle r="6" fill="#7fe6f2"/>`;
  } else if(n.tipo==="duvida"){
    r=17; shape=`<circle r="17" fill="#10161e" stroke="#e9e4d6" stroke-width="2.2" stroke-dasharray="4 4"/><circle r="4" fill="#e9e4d6" opacity=".7"/>`;
  } else {
    r = n.mini?12:(n.big?32:22); const fs = n.mini?14:(n.big?28:20);
    shape=`<circle r="${r}" fill="#1a0b0d" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="${n.mini?"4 3":"6 5"}" filter="url(#glr)"/>
      <text y="${fs*.36}" text-anchor="middle" fill="#ff4d4d" font-family="Archivo,sans-serif" font-weight="800" font-size="${fs}">?</text>`;
  }
  const al = n.alerta ? `<circle cx="${r*.8}" cy="${-r*.8}" r="7" fill="#ff8a3d" stroke="#05070b" stroke-width="2"/><text x="${r*.8}" y="${-r*.8+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#05070b" font-family="Archivo,sans-serif" style="stroke:none">!</text>` : "";
  const red = n.tipo==="lacuna" ? " r" : "";
  const lado = n.lab || (n.x===.5 ? "dir" : n.mini ? "dir" : "baixo");
  let lab;
  if(lado==="dir"||lado==="esq"){
    const dx = lado==="dir" ? r+16 : -(r+16), an = lado==="dir" ? "start" : "end";
    lab = n.mini ? `<text class="sub r" x="${dx}" y="4" text-anchor="${an}" font-size="12">${esc(n.t)}</text>`
      : `<text class="lbl${red}" x="${dx}" y="-2" text-anchor="${an}" font-size="17">${esc(n.t)}</text><text class="sub${red}" x="${dx}" y="18" text-anchor="${an}" font-size="13">${esc(n.s||"")}</text>`;
  } else {
    lab = `<text class="lbl${red}" y="${r+20}" text-anchor="middle" font-size="13.5">${esc(n.t)}</text>${n.s?`<text class="sub num${red}" y="${r+37}" text-anchor="middle" font-size="12">${esc(n.s)}</text>`:""}`;
  }
  return `<g class="node" id="nd-${n.id}" data-id="${n.dup||n.id}" transform="translate(${n.px},${n.py})" tabindex="0" role="button" aria-label="${esc(n.t)}">
    <circle class="ring" r="${r+6}"/><g class="shape">${shape}${al}</g>${lab}</g>`;
}

let T, byId, ORDEM, atual, parts = [];
function escolhe(id){
  T = TRILHAS.find(t=>t.id===id) || TRILHAS[0];
  document.querySelectorAll(".carta").forEach(c=>c.setAttribute("aria-pressed", c.dataset.id===T.id));
  T.N.forEach(n=>{n.px=n.x*W; n.py=TOP+n.r*RH});
  byId = Object.fromEntries(T.N.map(n=>[n.id,n]));
  ORDEM = T.N.filter(reais).sort((a,b)=>a.r-b.r||a.x-b.x).map(n=>n.id);
  const H = TOP + Math.max(...T.N.map(n=>n.r))*RH + 110;
  const conta = t => T.N.filter(n=>reais(n) && (n.tipo===t || (t==="cita"&&n.tipo==="fim"))).length;
  const pct = T.barra.v/T.barra.t*100;
  document.getElementById("hud").innerHTML = `
    <div class="cont num">
      <span title="Documento cita a emenda"><svg width="20" height="20" viewBox="-10 -10 20 20"><polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="#FDBD27"/></svg>${conta("cita")}</span>
      <span title="Ligamos nós" style="color:var(--cyan)"><svg width="20" height="20" viewBox="-10 -10 20 20"><circle r="7" fill="#0b1a22" stroke="#7fe6f2" stroke-width="2.5"/></svg>${conta("cruzado")}</span>
      <span title="Provável" style="color:var(--pale)"><svg width="20" height="20" viewBox="-10 -10 20 20"><circle r="7" fill="none" stroke="#e9e4d6" stroke-width="2" stroke-dasharray="3 3"/></svg>${conta("duvida")}</span>
      <span title="Elo que falta" style="color:var(--red)"><svg width="20" height="20" viewBox="-10 -10 20 20"><circle r="7" fill="none" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="4 3"/></svg>${conta("lacuna")}</span>
    </div>
    <div class="xp"><div class="row"><span>Emenda ${T.num} · ${esc(T.barra.txt)}</span><b class="num">${brl(T.barra.v)} de ${brl(T.barra.t)} · ${pct.toFixed(0)}%</b></div>
      <div class="bar${T.barra.mal?" mal":""}"><i style="width:${Math.max(pct,.6)}%"></i></div></div>`;
  const arcs = Array.from({length:9},(_,i)=>`<circle cx="500" cy="-260" r="${420+i*190}" fill="none" stroke="#7fe6f2" stroke-opacity="${(.05-i*.004).toFixed(3)}" stroke-width="1.2"/>`).join("");
  document.getElementById("map").innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rastro da emenda ${T.num}">
    <defs>
      <filter id="gl" filterUnits="userSpaceOnUse" x="-1200" y="-1200" width="3400" height="6000"><feGaussianBlur stdDeviation="5" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 .75 0 0 0  0 0 .2 0 0  0 0 0 .9 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glc" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glr" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="gg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#fff1b8"/><stop offset=".55" stop-color="#FDBD27"/><stop offset="1" stop-color="#b37a00"/></radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDBD27" stop-opacity=".35"/><stop offset="1" stop-color="#FDBD27" stop-opacity="0"/></linearGradient>
    </defs>
    ${arcs}
    <polygon points="440,0 560,0 650,${Math.min(H*.5,720)} 350,${Math.min(H*.5,720)}" fill="url(#beam)" opacity=".35"/>
    <text x="500" y="22" text-anchor="middle" class="ponta">Brasília</text>
    <g>${T.E.map(([a,b,t],i)=>`<path id="e${i}" d="${curva(byId[a],byId[b])}" fill="none" ${ES[t]}/>`).join("")}</g>
    <g id="sparks"></g>
    <g>${T.N.map(nodeSvg).join("")}</g>
    <text x="500" y="${H-16}" text-anchor="middle" class="ponta">${esc(T.cidade)}</text>
  </svg>`;
  document.querySelectorAll(".node").forEach(g=>{
    g.addEventListener("click",()=>abre(g.dataset.id));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();abre(g.dataset.id)}});
  });
  faiscas();
  abre(ORDEM[0]);
  if(location.hash.slice(1)!==T.id) history.replaceState(null,"","#"+T.id);
}

const panel = document.getElementById("panel");
function abre(id, foca){
  const n = byId[id]; atual = id;
  document.querySelectorAll(".node").forEach(g=>g.classList.toggle("sel", g.dataset.id===id));
  const i = ORDEM.indexOf(id);
  panel.innerHTML = `<button class="close" type="button" id="fechar">Fechar</button>
    <span class="tipo ${n.tipo}">${TIPO[n.tipo]}</span>
    <h2>${esc(n.titulo)}</h2>
    ${n.valor!=null?`<div class="valor num">${brl(n.valor)}</div>`:""}
    ${n.s?`<div class="data">${esc(n.t)} · ${esc(n.s)}</div>`:""}
    <p>${esc(n.texto)}</p>
    ${n.liga?`<div class="blk liga"><h3>Como ligamos</h3><p>${esc(n.liga)}</p></div>`:""}
    ${n.alerta?`<div class="blk alerta"><h3>A verificar</h3><p>${esc(n.alerta)}</p></div>`:""}
    <div class="blk"><h3>Fonte</h3><p>${esc(n.fonte)}${n.link?` · <a href="${n.link}" target="_blank" rel="noopener">abrir</a>`:""}</p></div>
    <div class="nav"><button type="button" id="ant">Anterior</button><span class="pos num">${i+1}/${ORDEM.length}</span><button type="button" id="prox">Próximo</button></div>`;
  panel.hidden = false;
  document.getElementById("ant").onclick = ()=>abre(ORDEM[(i-1+ORDEM.length)%ORDEM.length], true);
  document.getElementById("prox").onclick = ()=>abre(ORDEM[(i+1)%ORDEM.length], true);
  document.getElementById("fechar").onclick = ()=>{panel.hidden = true};
  if(foca){ const el=document.getElementById("nd-"+id); el && el.scrollIntoView({block:"center",inline:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}

/* Faíscas: o dinheiro descendo. Nas linhas vermelhas, a luz se apaga no meio. */
const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
function faiscas(){
  if(calmo) return;
  const NS="http://www.w3.org/2000/svg", sp=document.getElementById("sparks");
  const cor={of:"#ffe08a",cz:"#bff6fb",dv:"#e9e4d6",qb:"#ff6b6b",dp:"#5d6b7c"};
  parts = T.E.map(([a,b,t],i)=>{
    const p=document.getElementById("e"+i), c=document.createElementNS(NS,"circle");
    c.setAttribute("r", t==="of"?3.6:2.6); c.setAttribute("fill",cor[t]);
    if(t!=="dp") c.setAttribute("filter","url(#glc)");
    sp.appendChild(c);
    return {p,c,t,len:p.getTotalLength(),off:Math.random(),vel:t==="of"?.00028:.00022};
  });
}
let t0 = performance.now();
if(!calmo) (function tick(now){
  const dt=now-t0; t0=now;
  for(const q of parts){
    q.off=(q.off+q.vel*dt*(600/Math.max(q.len,120)))%1;
    const f=q.off*(q.t==="qb"?.5:1), pt=q.p.getPointAtLength(f*q.len);
    q.c.setAttribute("cx",pt.x); q.c.setAttribute("cy",pt.y);
    q.c.setAttribute("opacity",(q.t==="qb"?1-q.off:Math.sin(q.off*Math.PI)).toFixed(2));
  }
  requestAnimationFrame(tick);
})(t0);

deck.addEventListener("click",e=>{const c=e.target.closest(".carta"); if(c) escolhe(c.dataset.id)});
addEventListener("hashchange",()=>{ if(location.hash.slice(1)!==T.id) escolhe(location.hash.slice(1)) });
escolhe(location.hash.slice(1));
</script>
